<!DOCTYPE html>
<html lang="uk">
<head>
  <meta name="robots" content="noindex">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DVHX3G2VJV"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Знайди першим — MindWorld School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Жирный Baloo 2 для цифр (счёт, таймер); остальные шрифты даёт оболочка -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <!-- Общая оболочка публичных тренажёров: шапка, языки, шрифты, цвета -->
  <link rel="stylesheet" href="/trainer-shell/shell.v1.css">
  <link rel="stylesheet" href="css/styles.css?v=1">
  <script src="/trainer-shell/shell.v1.js"></script>
</head>
<body>
  <!-- Сюда оболочка вставит шапку (лого, название, UA / EN / RU / ES) -->
  <div id="mw-header"></div>

  <!-- Экран загрузки -->
  <div id="loading-screen" class="screen">
    <div class="loading-content">
      <div class="loader"></div>
      <p class="loading-text" data-i18n="loading">Завантаження...</p>
    </div>
  </div>

  <!-- Главное меню (настройки) -->
  <div id="menu-screen" class="screen hidden">

    <main class="settings-screen">
      <div class="panel">
        <div class="setup-section">
          <h3 class="setup-title" data-i18n="playersCount">Кількість гравців</h3>
          <div class="setup-buttons">
            <button class="opt active" data-players="1">1</button>
            <button class="opt" data-players="2">2</button>
            <button class="opt" data-players="3">3</button>
            <button class="opt" data-players="4">4</button>
          </div>
        </div>

        <div class="setup-section">
          <h3 class="setup-title" data-i18n="difficulty">Складність</h3>
          <div class="setup-buttons">
            <button class="opt" data-difficulty="easy">
              <span class="opt-name" data-i18n="difficultyEasy">Легко</span>
              <small data-i18n="easyInfo">13 карт • 4 символи</small>
            </button>
            <button class="opt active" data-difficulty="medium">
              <span class="opt-name" data-i18n="difficultyMedium">Середньо</span>
              <small data-i18n="mediumInfo">31 карта • 6 символів</small>
            </button>
            <button class="opt" data-difficulty="hard">
              <span class="opt-name" data-i18n="difficultyHard">Складно</span>
              <small data-i18n="hardInfo">55 карт • 8 символів</small>
            </button>
          </div>
        </div>

        <div class="setup-section timer-slider-section" id="timer-section">
          <h3 class="setup-title" data-i18n="moveTime">Час на хід</h3>
          <div class="timer-slider-container">
            <input type="range" class="timer-slider" id="timer-slider" min="0" max="180" value="60" step="5">
            <span class="timer-value" id="timer-value">1:00</span>
          </div>
        </div>

        <button class="btn start btn-start" data-i18n="startGame">Почати гру</button>
      </div>
    </main>
  </div>

  <!-- Игровой экран -->
  <div id="game-screen" class="screen hidden">
    <!-- Информационная панель ВВЕРХУ -->
    <div class="game-info">
      <!-- Слева: счётчик карт -->
      <div class="info-left">
        <span class="cards-remaining"><span data-i18n="cardsRemaining">Залишилось:</span> <strong id="cards-remaining">0</strong></span>
      </div>

      <!-- По центру: таймер (1 игрок) или панель игроков (2-4) -->
      <div class="info-center">
        <span class="timer hidden" id="timer-display">⏱️ <strong>60</strong></span>
        <div class="players-scores-top hidden" id="players-scores-top">
          <!-- Игроки добавляются через JS -->
        </div>
      </div>

      <!-- Справа: кнопки -->
      <div class="info-right">
        <button class="btn-icon btn-pause" aria-label="Пауза" data-i18n-title="pause">⏸</button>
        <button class="btn-icon btn-exit" aria-label="Вийти" data-i18n-title="exit">✖</button>
      </div>
    </div>

    <!-- Подсказка, что делать -->
    <p class="game-hint" data-i18n="findHint">Знайди однакову картинку: натисни її на своїй картці, а потім на колоді</p>

    <!-- Игровое поле -->
    <div class="game-board" id="game-board">
      <!-- Карты добавляются через JS -->
    </div>
  </div>

  <!-- Экран результатов -->
  <div id="results-screen" class="screen hidden">
    <div class="results-screen">
      <div class="result-card">
        <h2 class="results-title" data-i18n="gameOver">Гра закінчена!</h2>

        <!-- Результаты для 1 игрока -->
        <ul class="result-stats solo-results hidden" id="solo-results">
          <li><span data-i18n="collectedCards">Зібрано карт</span><b id="solo-cards">0</b></li>
          <li><span data-i18n="time">Час</span><b id="solo-time">0:00</b></li>
          <li><span data-i18n="accuracy">Точність</span><b id="solo-accuracy">100%</b></li>
        </ul>

        <!-- Результаты для 2+ игроков -->
        <div class="multi-results hidden" id="multi-results">
          <p class="winner-line" id="winner-line"></p>
          <ol class="winners-podium" id="winners-podium">
            <!-- Генерируется JS -->
          </ol>
        </div>

        <div class="result-actions">
          <button class="btn start btn-play-again" data-i18n="playAgain">Грати знову</button>
          <button class="btn ghost btn-menu" data-i18n="toMenu">В меню</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно паузы -->
  <div id="pause-modal" class="modal hidden">
    <div class="modal-content">
      <h3 data-i18n="pauseTitle">Пауза</h3>
      <button class="btn start btn-resume" data-i18n="resume">Продовжити</button>
      <button class="btn ghost btn-exit-game" data-i18n="exitToMenu">Вийти в меню</button>
    </div>
  </div>

  <!-- Модальное окно подтверждения выхода -->
  <div id="exit-modal" class="modal hidden">
    <div class="modal-content">
      <h3 data-i18n="exitConfirmTitle">Вийти з гри?</h3>
      <button class="btn danger btn-exit-confirm" data-i18n="exitConfirm">Так, вийти</button>
      <button class="btn ghost btn-exit-cancel" data-i18n="exitCancel">Скасувати</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
